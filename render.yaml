services:
  - type: web
    name: jml-annonces
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true

  - type: web
    name: jml-studio-test
    runtime: node
    plan: free
    branch: main
    rootDir: jml-studio
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
