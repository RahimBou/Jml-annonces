<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JML Annonces Auto</title>
  <style>
    :root {
      --green: #17382f;
      --gold: #c6a15b;
      --cream: #f6f2e9;
      --ink: #202420;
      --muted: #6f746f;
      --line: #ddd8ca;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background:var(--cream); color:var(--ink); }
    header { background:var(--green); color:white; padding:22px 20px; border-bottom:4px solid var(--gold); box-shadow:0 3px 14px rgba(0,0,0,.08); }
    header .wrap, main { max-width:1180px; margin:auto; }
    .brand { font-size:27px; font-weight:800; letter-spacing:.4px; }
    .tagline { color:#e7dcc3; margin-top:5px; font-size:14px; }
    main { padding:24px 20px 60px; }
    .card { background:white; border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 8px 28px rgba(31,45,39,.07); }
    label { display:block; font-weight:700; margin-bottom:8px; }
    .row { display:flex; gap:10px; }
    input { flex:1; min-width:0; padding:14px; border:1px solid #cfc8b7; border-radius:10px; font-size:16px; }
    button { border:0; border-radius:10px; padding:14px 18px; background:var(--green); color:white; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin-top:14px; color:var(--muted); }
    .error { color:#a12626; font-weight:700; }
    .success { color:#226b45; font-weight:700; }
    #result { margin-top:22px; display:none; }
    .grid { display:grid; grid-template-columns:minmax(300px,.9fr) minmax(420px,1.4fr); gap:26px; align-items:start; }
    h1 { margin:0 0 12px; font-size:31px; line-height:1.12; color:var(--green); }
    h2 { color:var(--green); margin-top:0; }
    #location { color:var(--muted); margin:0 0 12px; font-size:15px; }
    #price { color:var(--green); font-size:25px; margin:8px 0 18px; }
    #description { line-height:1.55; color:#4f554f; }
    .facts { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-top:18px; }
    .fact { padding:13px 14px; background:#faf8f2; border:1px solid #eee8d9; border-radius:12px; }
    .fact b { display:block; font-size:18px; margin-top:4px; color:var(--green); }
    .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .photos img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:11px; background:#f1eee7; display:block; }
    .photo-warning { margin-top:12px; padding:12px 14px; border-radius:11px; background:#fbf4df; border:1px solid #ead9aa; color:#65552e; font-size:14px; font-weight:600; }
    .photo-meta { margin-top:8px; color:var(--muted); font-size:12px; line-height:1.45; }
    .photo-blocked { background:#f9e8e8; border-color:#e4b8b8; color:#8b2d2d; }
    .photo-complete { background:#edf7ef; border-color:#bddbc4; color:#28633a; }
    .photo-partial { background:#fff6df; border-color:#ead39a; color:#745b1c; }
    .photo-status { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:800; }
    .photo-details { margin-top:8px; font-size:11px; color:var(--muted); }
    @media (max-width:800px) {
      .row, .grid { display:block; }
      button { margin-top:10px; width:100%; }
      .photos { margin-top:18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">JML Immobilier</div>
      <div class="tagline">Annonces Auto — génération de publications à partir des vraies annonces JML</div>
    </div>
  </header>

  <main>
    <section class="card">
      <label for="url">Lien de l'annonce JML</label>
      <div class="row">
        <input id="url" placeholder="https://www.jml-immobilier.fr/vente/..." autocomplete="url">
        <button id="load">Récupérer l'annonce</button>
      </div>
      <div id="status" class="status">Aucune donnée chargée.</div>
    </section>

    <section id="result" class="card">
      <div class="grid">
        <div>
          <h1 id="title"></h1>
          <div id="subtitle" style="font-weight:700;color:var(--green);margin:-5px 0 12px;"></div>
          <p id="location"></p>
          <h2 id="price"></h2>
          <p id="description"></p>
          <div class="facts">
            <div class="fact">Surface<b id="surface">—</b></div>
            <div class="fact">Terrain<b id="terrain">—</b></div>
            <div class="fact">Chambres<b id="bedrooms">—</b></div>
            <div class="fact">Pièces<b id="rooms">—</b></div>
          </div>
          <div class="actions"><button id="generate">Générer le visuel JML</button></div>
        </div>
        <div>
          <h2>Photos originales récupérées</h2>
          <div id="photos" class="photos"></div>
          <div id="photoStatus" class="photo-status"></div>
          <div id="photoWarning" class="photo-warning"></div>
          <div id="photoMeta" class="photo-meta"></div>
        </div>
      </div>
    </section>
  </main>

<script>
const $ = (id) => document.getElementById(id);
let currentData = null;


function propertyType(title) {
  const m = String(title || "").match(/^(Appartement|Maison|Pavillon|Terrain|Garage|Immeuble|Local commercial|Local|Studio|Duplex|Loft)/i);
  return m ? m[1].toUpperCase() : "BIEN IMMOBILIER";
}

function fitCanvasText(ctx, text, x, y, maxWidth, font) {
  ctx.font = font;
  let value = String(text || "");
  while (value.length > 2 && ctx.measureText(value + "...").width > maxWidth) value = value.slice(0, -1);
  ctx.fillText(value + (value !== String(text || "") ? "..." : ""), x, y);
}

function cropCanvasImage(ctx, img, x, y, w, h) {
  const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const sw = w / scale, sh = h / scale;
  const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function loadCanvasImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = "/api/image?url=" + encodeURIComponent(src);
  });
}

async function renderJmlTemplate() {
  if (!currentData) return;
  const p = currentData.listing;
  const canvas = $("visual");
  const ctx = canvas.getContext("2d");
  const green = "#073b2a", gold = "#c8a24d";
  ctx.clearRect(0, 0, 1200, 1200);
  ctx.fillStyle = "#f7f4ec";
  ctx.fillRect(0, 0, 1200, 1200);

  const images = await Promise.all((p.images || []).map(loadCanvasImage));
  const valid = images.filter(Boolean);
  if (!valid.length) return;

  cropCanvasImage(ctx, valid[0], 0, 0, 1200, 455);

  // JML branding block.
  const brand = ctx.createLinearGradient(0, 0, 520, 0);
  brand.addColorStop(0, "rgba(255,255,255,.96)");
  brand.addColorStop(1, "rgba(255,255,255,.02)");
  ctx.fillStyle = brand; ctx.fillRect(0, 0, 520, 170);
  ctx.fillStyle = green; ctx.font = "bold 44px Georgia"; ctx.fillText("JML", 38, 62);
  ctx.fillStyle = gold; ctx.font = "bold 44px Georgia"; ctx.fillText(" IMMOBILIER", 108, 62);
  ctx.fillStyle = "#555"; ctx.font = "16px Arial"; ctx.fillText("VOTRE PROJET, NOTRE ENGAGEMENT", 40, 98);

  // Sale/location badge.
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.moveTo(780,0); ctx.lineTo(1200,0); ctx.lineTo(1200,225); ctx.lineTo(875,225); ctx.lineTo(780,140); ctx.closePath(); ctx.fill();
  ctx.fillStyle = gold; ctx.font = "bold 52px Georgia"; ctx.textAlign = "center"; ctx.fillText("À VENDRE", 995, 62);
  ctx.fillStyle = gold; ctx.fillRect(900, 80, 240, 46);
  ctx.fillStyle = "#111"; ctx.font = "bold 23px Arial"; ctx.fillText(propertyType(p.title), 1020, 111);
  ctx.fillStyle = "#fff"; ctx.font = "bold 19px Arial";
  fitCanvasText(ctx, String(p.location || "").toUpperCase(), 990, 164, 370, "bold 19px Arial");
  ctx.font = "17px Arial";
  const postal = String(p.location || "").match(/\((\d{5})\)/);
  ctx.fillText(postal ? postal[1] : "", 990, 190);

  // Price badge.
  ctx.fillStyle = "#f1d38a";
  ctx.fillRect(875, 338, 325, 117);
  ctx.fillStyle = "#111"; ctx.font = "bold 46px Georgia"; ctx.fillText(p.price || "", 1037, 386);
  ctx.font = "23px Georgia"; ctx.fillText("Réf. " + (p.reference || "—"), 1037, 424);
  ctx.textAlign = "left";

  // Photo mosaic: one hero + two large + remaining originals.
  const rest = valid.slice(1);
  if (rest[0]) cropCanvasImage(ctx, rest[0], 0, 463, 600, 235);
  if (rest[1]) cropCanvasImage(ctx, rest[1], 608, 463, 592, 235);
  const small = rest.slice(2);
  if (small.length) {
    const cols = Math.min(5, small.length), gap = 8, y = 706, h = 169;
    const w = (1200 - gap * (cols - 1)) / cols;
    small.forEach((img, i) => cropCanvasImage(ctx, img, i * (w + gap), y, w, h));
  }

  // Main facts strip.
  const statsY = small.length ? 875 : 706;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, statsY, 1200, 105);
  const stats = [
    ["⌂", p.surface || "—", "m² habitables"],
    ["♧", p.terrain || "—", "Terrain"],
    ["▣", String(p.bedrooms == null ? "—" : p.bedrooms), "chambres"],
    ["▰", String(p.rooms == null ? "—" : p.rooms), "pièces"],
    ["▤", /garage/i.test(p.description || "") ? "1" : "—", "garage"]
  ];
  const sw = 1200 / stats.length;
  stats.forEach((item, i) => {
    const x = i * sw + 28;
    ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(x + 22, statsY + 52, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "25px Arial"; ctx.textAlign = "center"; ctx.fillText(item[0], x + 22, statsY + 61);
    ctx.textAlign = "left"; ctx.fillStyle = "#111"; ctx.font = "bold 22px Georgia"; ctx.fillText(item[1], x + 62, statsY + 48);
    ctx.font = "15px Arial"; ctx.fillText(item[2], x + 62, statsY + 70);
  });

  // Highlights strip.
  const hy = statsY + 105;
  ctx.fillStyle = green; ctx.fillRect(0, hy, 1200, 125);
  const highlights = (p.highlights && p.highlights.length ? p.highlights : ["Informations de l'annonce"]).slice(0, 6);
  const hw = 1200 / highlights.length;
  highlights.forEach((item, i) => {
    const x = i * hw + 16;
    ctx.fillStyle = gold; ctx.font = "24px Arial"; ctx.fillText("◆", x, hy + 50);
    ctx.fillStyle = "#fff"; fitCanvasText(ctx, item, x + 34, hy + 46, hw - 45, "bold 16px Arial");
  });

  // Contact footer.
  const fy = hy + 125;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, fy, 1200, 120);
  ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(70, fy + 60, 39, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "32px Arial"; ctx.textAlign = "center"; ctx.fillText("☎", 70, fy + 70);
  ctx.textAlign = "left"; ctx.fillStyle = "#222"; ctx.font = "18px Georgia"; ctx.fillText("Une visite ? Contactez-moi", 130, fy + 40);
  ctx.font = "bold 33px Georgia"; ctx.fillText("06 26 93 50 41", 130, fy + 82);
  ctx.fillStyle = gold; ctx.fillRect(510, fy + 20, 2, 80);
  ctx.fillStyle = "#b18c3f"; ctx.font = "bold 21px Georgia"; ctx.fillText("Abderrahim Boujnikh", 550, fy + 42);
  ctx.fillStyle = "#333"; ctx.font = "18px Georgia"; ctx.fillText("Agent commercial indépendant", 550, fy + 68);
  ctx.fillText("Réseau JML Immobilier", 550, fy + 92);
  ctx.fillStyle = green; ctx.font = "bold 25px Georgia"; ctx.fillText("JML IMMOBILIER", 945, fy + 55);
  ctx.fillStyle = "#777"; ctx.font = "11px Arial"; ctx.fillText("VOTRE PROJET, NOTRE ENGAGEMENT", 945, fy + 75);
  ctx.textAlign = "left";

  $("visualSection").style.display = "block";
}

$("load").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) return;

  $("load").disabled = true;
  $("status").textContent = "Récupération de l'annonce et des photos originales…";
  $("status").className = "status";
  $("result").style.display = "none";

  try {
    const response = await fetch("/api/scrape", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Impossible de récupérer l'annonce.");

    const p = data.listing;
    currentData = data;
    const rawTitle = p.title || "Annonce JML";
    const typeMatch = rawTitle.match(/^(Appartement|Maison|Pavillon|Terrain|Garage|Immeuble|Local commercial|Local|Studio|Duplex|Loft)/i);
    const propertyType = typeMatch ? typeMatch[1] : rawTitle.split(/\s+/)[0];
    $("title").textContent = propertyType;
    $("subtitle").textContent = [
      p.rooms ? `${p.rooms} pièces` : "",
      p.bedrooms ? `${p.bedrooms} chambres` : "",
      p.surface || ""
    ].filter(Boolean).join(" · ");
    $("location").textContent = p.location || "Localisation non détectée";
    $("price").textContent = p.price || "Prix non détecté";
    $("description").textContent = p.description || "Description non détectée";
    $("surface").textContent = p.surface || "—";
    $("terrain").textContent = p.terrain || "—";
    $("bedrooms").textContent = p.bedrooms ?? "—";
    $("rooms").textContent = p.rooms ?? "—";

    const photos = $("photos");
    photos.innerHTML = "";

    // Preload first, then insert only successfully loaded images.
    // This avoids empty grid cells while an image is still loading.
    let loadedCount = 0;
    let finishedCount = 0;
    const totalCount = p.images.length;

    const refreshPhotoStatus = () => {
      if (finishedCount < totalCount) {
        $("photoWarning").textContent = `⏳ Vérification des ${totalCount} photo(s) originales…`;
        return;
      }

      const extraction = p.photoExtraction || {};
      const expected = p.expectedPhotoCount;
      const complete = data.photoPolicy?.publishAllowedForPhotoTest === true;

      const photoState = p.photoStatus || (complete ? "complete" : "partial");
      const stateConfig = {
        complete: { label: "🟢 Galerie complète et vérifiée", className: "photo-complete" },
        partial: { label: "🟠 Galerie partiellement récupérée", className: "photo-partial" },
        unreliable: { label: "🔴 Galerie non fiable — publication interdite", className: "photo-blocked" }
      }[photoState] || { label: "🔴 Galerie non fiable — publication interdite", className: "photo-blocked" };

      $("photoStatus").className = "photo-status " + stateConfig.className;
      $("photoStatus").textContent = stateConfig.label;

      $("photoWarning").classList.toggle("photo-blocked", !complete);
      $("photoWarning").textContent = complete
        ? `${loadedCount} photo(s) originales détectées dans la galerie principale. Aucune photo IA ne sera utilisée.`
        : "⚠ Extraction photo non considérée comme complète : publication bloquée jusqu'à vérification.";

      const expectedText = expected != null ? ` • ${loadedCount}/${expected} attendue(s)` : "";
      const reasons = Array.isArray(extraction.reasons) && extraction.reasons.length
        ? `<br>Motif : ${extraction.reasons.join(" ") }`
        : "";

      $("photoMeta").innerHTML =
        `Source : ${extraction.source || "aucune"} • confiance : ${extraction.confidence || "faible"}${expectedText}` +
        reasons;
    };

    const loadOriginalPhoto = (src) => new Promise((resolve) => {
      const img = new Image();
      img.alt = "Photo originale de l'annonce JML";
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = "/api/image?url=" + encodeURIComponent(src);
    });

    p.images.forEach(async (src) => {
      const img = await loadOriginalPhoto(src);
      finishedCount++;

      if (img) {
        img.loading = "lazy";
        img.className = "verified-photo";
        img.dataset.photoPosition = String(loadedCount + 1);
        photos.appendChild(img);
        loadedCount++;
      }

      refreshPhotoStatus();
    });

    if (!totalCount) {
      $("photoWarning").textContent = "⚠ Aucune photo originale récupérée : la future publication devra rester bloquée.";
    }

    $("status").textContent = "Annonce récupérée.";
    $("status").className = "status success";
    $("result").style.display = "block";
  } catch (error) {
    $("status").textContent = error.message;
    $("status").className = "status error";
  } finally {
    $("load").disabled = false;
  }
});

$("generate").addEventListener("click", async () => {
  if (!currentData) return;
  if (currentData.photoPolicy?.publishAllowedForPhotoTest !== true) {
    alert("La galerie doit être complète et vérifiée avant de générer le visuel.");
    return;
  }
  await renderJmlTemplate();
  $("visualSection").scrollIntoView({ behavior: "smooth", block: "start" });
});

$("download").addEventListener("click", () => {
  const ref = currentData?.listing?.reference || "annonce";
  const link = document.createElement("a");
  link.download = "JML-" + ref + ".png";
  link.href = $("visual").toDataURL("image/png");
  link.click();
});
</script>
</body>
</html>
