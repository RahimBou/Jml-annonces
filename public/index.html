<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JML Annonces Auto</title>
  <style>
    :root {
      --green: #17382f;
      --gold: #c6a15b;
      --cream: #f6f2e9;
      --ink: #202420;
      --muted: #6f746f;
      --line: #ddd8ca;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background:var(--cream); color:var(--ink); }
    header { background:var(--green); color:white; padding:22px 20px; border-bottom:4px solid var(--gold); box-shadow:0 3px 14px rgba(0,0,0,.08); }
    header .wrap, main { max-width:1180px; margin:auto; }
    .brand { font-size:27px; font-weight:800; letter-spacing:.4px; }
    .tagline { color:#e7dcc3; margin-top:5px; font-size:14px; }
    main { padding:24px 20px 60px; }
    .card { background:white; border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 8px 28px rgba(31,45,39,.07); }
    label { display:block; font-weight:700; margin-bottom:8px; }
    .row { display:flex; gap:10px; }
    input { flex:1; min-width:0; padding:14px; border:1px solid #cfc8b7; border-radius:10px; font-size:16px; }
    button { border:0; border-radius:10px; padding:14px 18px; background:var(--green); color:white; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin-top:14px; color:var(--muted); }
    .error { color:#a12626; font-weight:700; }
    .success { color:#226b45; font-weight:700; }
    #result { margin-top:22px; display:none; }
    .grid { display:grid; grid-template-columns:minmax(300px,.9fr) minmax(420px,1.4fr); gap:26px; align-items:start; }
    h1 { margin:0 0 12px; font-size:31px; line-height:1.12; color:var(--green); }
    h2 { color:var(--green); margin-top:0; }
    #location { color:var(--muted); margin:0 0 12px; font-size:15px; }
    #price { color:var(--green); font-size:25px; margin:8px 0 18px; }
    #description { line-height:1.55; color:#4f554f; }
    .facts { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-top:18px; }
    .fact { padding:13px 14px; background:#faf8f2; border:1px solid #eee8d9; border-radius:12px; }
    .fact b { display:block; font-size:18px; margin-top:4px; color:var(--green); }
    .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .photos img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:11px; background:#f1eee7; display:block; }
    .photo-warning { margin-top:12px; padding:12px 14px; border-radius:11px; background:#fbf4df; border:1px solid #ead9aa; color:#65552e; font-size:14px; font-weight:600; }
    .photo-meta { margin-top:8px; color:var(--muted); font-size:12px; line-height:1.45; }
    .photo-blocked { background:#f9e8e8; border-color:#e4b8b8; color:#8b2d2d; }
    .photo-complete { background:#edf7ef; border-color:#bddbc4; color:#28633a; }
    .photo-partial { background:#fff6df; border-color:#ead39a; color:#745b1c; }
    .photo-status { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:800; }
    .photo-details { margin-top:8px; font-size:11px; color:var(--muted); }
    @media (max-width:800px) {
      .row, .grid { display:block; }
      button { margin-top:10px; width:100%; }
      .photos { margin-top:18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">JML Immobilier</div>
      <div class="tagline">Annonces Auto — génération de publications à partir des vraies annonces JML</div>
    </div>
  </header>

  <main>
    <section class="card">
      <label for="url">Lien de l'annonce JML</label>
      <div class="row">
        <input id="url" placeholder="https://www.jml-immobilier.fr/vente/..." autocomplete="url">
        <button id="load">Récupérer l'annonce</button>
      </div>
      <div id="status" class="status">Aucune donnée chargée.</div>
    </section>

    <section id="result" class="card">
      <div class="grid">
        <div>
          <h1 id="title"></h1>
          <div id="subtitle" style="font-weight:700;color:var(--green);margin:-5px 0 12px;"></div>
          <p id="location"></p>
          <h2 id="price"></h2>
          <p id="description"></p>
          <div class="facts">
            <div class="fact">Surface<b id="surface">—</b></div>
            <div class="fact">Terrain<b id="terrain">—</b></div>
            <div class="fact">Chambres<b id="bedrooms">—</b></div>
            <div class="fact">Pièces<b id="rooms">—</b></div>
          </div>
          <div class="actions" style="display:flex;gap:10px;flex-wrap:wrap"><button id="generate">Générer le visuel JML</button><button id="generateAI" style="background:#b28b3f">✨ Générer avec Gemini</button></div>
        </div>
        <div>
          <h2>Photos originales récupérées</h2>
          <div id="photos" class="photos"></div>
          <div id="photoStatus" class="photo-status"></div>
          <div id="photoWarning" class="photo-warning"></div>
          <div id="photoMeta" class="photo-meta"></div><div id="aiStatus" class="photo-meta" style="margin-top:10px;font-weight:700"></div>
        </div>
      </div>
    </section>
  </main>

  <section id="visualSection" class="card" style="display:none;margin-top:20px">
    <div class="visual-actions" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px">
      <h2 style="margin:0;color:var(--green)">Visuel JML généré</h2>
      <button id="download" class="secondary">Exporter le visuel PNG</button>
    </div>
    <div class="canvas-wrap" style="background:#e9e5da;padding:14px;border-radius:16px;overflow:auto;text-align:center">
      <canvas id="visual" width="1200" height="1200" style="width:min(100%,900px);height:auto;display:block;margin:auto;box-shadow:0 8px 30px rgba(0,0,0,.16)"></canvas>
    </div>
  </section>

<script>
const $ = (id) => document.getElementById(id);
let currentData = null;


function propertyType(title) {
  const m = String(title || "").match(/^(Appartement|Maison|Pavillon|Terrain|Garage|Immeuble|Local commercial|Local|Studio|Duplex|Loft)/i);
  return m ? m[1].toUpperCase() : "BIEN IMMOBILIER";
}

function fitCanvasText(ctx, text, x, y, maxWidth, font) {
  ctx.font = font;
  let value = String(text || "");
  while (value.length > 2 && ctx.measureText(value + "...").width > maxWidth) value = value.slice(0, -1);
  ctx.fillText(value + (value !== String(text || "") ? "..." : ""), x, y);
}

function cropCanvasImage(ctx, img, x, y, w, h) {
  const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const sw = w / scale, sh = h / scale;
  const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function loadCanvasImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = "/api/image?url=" + encodeURIComponent(src);
  });
}

async function renderJmlTemplate() {
  if (!currentData) return;

  const p = currentData.listing;
  const canvas = $("visual");
  const ctx = canvas.getContext("2d");
  const W = 1200, H = 1200;
  const GREEN = "#063b2a", GOLD = "#c7a24d", CREAM = "#f7f4ea", WHITE = "#ffffff", INK = "#151515";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = CREAM;
  ctx.fillRect(0,0,W,H);

  const aiOrder = Array.isArray(p.aiPlan?.photoOrder) ? p.aiPlan.photoOrder : (p.images || []).map((_,i)=>i);
  const sourceUrls = aiOrder.map(i => p.images?.[i]).filter(Boolean).slice(0, 7);
  const loaded = await Promise.all(sourceUrls.map(loadCanvasImage));
  const photos = loaded.filter(Boolean);
  if (!photos.length) return;

  // Exact reference geometry: hero 468 px, gallery 422 px, stats 105 px,
  // green highlights 105 px, contact footer 100 px.
  const HERO_H = 468;
  const GALLERY_Y = 472;
  const GALLERY_H = 416;
  const STATS_Y = 892;
  const STATS_H = 102;
  const HIGHLIGHTS_Y = 994;
  const HIGHLIGHTS_H = 104;
  const FOOTER_Y = 1098;
  const FOOTER_H = 102;

  // HERO
  cropCanvasImage(ctx, photos[0], 0, 0, W, HERO_H);

  // Soft white brand area, matching the reference.
  const brand = ctx.createLinearGradient(0,0,460,0);
  brand.addColorStop(0,"rgba(255,255,255,.98)");
  brand.addColorStop(1,"rgba(255,255,255,.05)");
  ctx.fillStyle = brand;
  ctx.fillRect(0,0,475,175);

  // Fixed JML master logo: same asset on every generated visual.
  const logo = await loadCanvasImage("/jml-logo.svg");
  if (logo) {
    ctx.drawImage(logo,28,12,430,115);
  }

  // TOP RIGHT GREEN/GOLD folded badge.
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(790,0); ctx.lineTo(1200,0); ctx.lineTo(1200,235);
  ctx.lineTo(910,235); ctx.lineTo(790,105); ctx.closePath(); ctx.fill();

  ctx.fillStyle = GOLD;
  ctx.font = "bold 52px Georgia";
  ctx.textAlign = "center";
  ctx.fillText("À VENDRE",995,62);

  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.roundRect(900,82,245,48,24); ctx.fill();
  ctx.fillStyle = INK;
  ctx.font = "bold 23px Arial";
  ctx.fillText(propertyType(p.title),1022,113);

  ctx.fillStyle = WHITE;
  ctx.font = "bold 19px Arial";
  const locationText = String(p.location || "");
  const postal = locationText.match(/\((\d{5})\)/);
  const city = locationText.replace(/\s*\(\d{5}\)/,"").trim();
  fitCanvasText(ctx,city.toUpperCase(),995,168,370,"bold 19px Arial");
  ctx.font = "17px Arial";
  ctx.fillText(postal ? postal[1] : "",995,198);

  // PRICE GOLD PANEL.
  ctx.fillStyle = "#f1d58d";
  ctx.beginPath();
  ctx.moveTo(925,339); ctx.lineTo(1200,339); ctx.lineTo(1200,468); ctx.lineTo(875,468);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = INK;
  ctx.font = "bold 47px Georgia";
  ctx.fillText(p.price || "Prix",1037,402);
  ctx.font = "24px Georgia";
  ctx.fillText("Réf. " + (p.reference || "—"),1037,442);
  ctx.textAlign = "left";

  // GALLERY: exactly the same 2 + 4 mosaic structure as the reference.
  // We use only verified original photos.
  const gap = 5;
  const galleryPhotos = photos.slice(1,7);
  if (galleryPhotos[0]) cropCanvasImage(ctx,galleryPhotos[0],0,GALLERY_Y,595,230);
  if (galleryPhotos[1]) cropCanvasImage(ctx,galleryPhotos[1],600,GALLERY_Y,600,230);

  const smallY = GALLERY_Y + 235;
  const smallW = (W - gap*3) / 4;
  for (let i=0;i<4;i++) {
    const img = galleryPhotos[i+2];
    if (img) cropCanvasImage(ctx,img,i*(smallW+gap),smallY,smallW,181);
  }

  // STATS — five columns exactly like the reference.
  ctx.fillStyle = WHITE;
  ctx.fillRect(0,STATS_Y,W,STATS_H);

  const stats = [
    ["⌂",p.surface || "—","habitables"],
    ["♧",p.terrain || "—","Terrain"],
    ["▣",String(p.bedrooms ?? "—"),"chambres"],
    ["▰",String(p.rooms ?? "—"),"pièces"],
    ["▤",/garage/i.test(p.description || "") ? "1" : "—","garage"]
  ];
  const statW = W/5;

  stats.forEach((item,i)=>{
    const left=i*statW;
    if(i>0){
      ctx.strokeStyle="#cfc9bb"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(left,STATS_Y+18); ctx.lineTo(left,STATS_Y+84); ctx.stroke();
    }

    ctx.fillStyle=GOLD;
    ctx.beginPath(); ctx.arc(left+48,STATS_Y+52,30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=WHITE;
    ctx.font="27px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(item[0],left+48,STATS_Y+53);

    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle=INK;
    ctx.font="bold 24px Georgia";
    ctx.fillText(item[1],left+94,STATS_Y+49);
    ctx.font="15px Georgia";
    ctx.fillText(item[2],left+94,STATS_Y+70);
  });

  // GREEN HIGHLIGHTS BAND — six columns exactly like the reference.
  ctx.fillStyle=GREEN;
  ctx.fillRect(0,HIGHLIGHTS_Y,W,HIGHLIGHTS_H);

  const highlights=(p.aiPlan?.highlights?.length ? p.aiPlan.highlights : (p.highlights && p.highlights.length ? p.highlights : ["Informations de l'annonce"])).slice(0,6);
  const columns=6;
  const colW=W/columns;

  highlights.forEach((item,i)=>{
    const x=i*colW;
    if(i>0){
      ctx.strokeStyle="rgba(255,255,255,.7)";
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,HIGHLIGHTS_Y+12); ctx.lineTo(x,HIGHLIGHTS_Y+92); ctx.stroke();
    }
    ctx.fillStyle=GOLD;
    ctx.font="30px Arial";
    ctx.textAlign="center";
    ctx.fillText("◆",x+34,HIGHLIGHTS_Y+53);
    ctx.textAlign="left";
    ctx.fillStyle=WHITE;
    fitCanvasText(ctx,item,x+58,HIGHLIGHTS_Y+43,colW-70,"bold 14px Georgia");
  });

  // CONTACT FOOTER — fixed bottom area.
  ctx.fillStyle=WHITE;
  ctx.fillRect(0,FOOTER_Y,W,FOOTER_H);

  ctx.fillStyle=GOLD;
  ctx.beginPath(); ctx.arc(70,FOOTER_Y+51,38,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=WHITE;
  ctx.font="32px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("☎",70,FOOTER_Y+52);

  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=INK;
  ctx.font="18px Georgia";
  ctx.fillText("Une visite ? Contactez-moi",132,FOOTER_Y+38);
  ctx.font="bold 34px Georgia";
  ctx.fillText("06 26 93 50 41",132,FOOTER_Y+76);

  ctx.fillStyle=GOLD;
  ctx.fillRect(510,FOOTER_Y+17,2,68);

  ctx.fillStyle="#a9853c";
  ctx.font="bold 21px Georgia";
  ctx.fillText("Abderrahim Boujnikh",552,FOOTER_Y+35);
  ctx.fillStyle="#333";
  ctx.font="17px Georgia";
  ctx.fillText("Agent commercial indépendant",552,FOOTER_Y+58);
  ctx.fillText("Réseau JML Immobilier",552,FOOTER_Y+80);

  // Bottom right master logo.
  const bottomLogo = await loadCanvasImage("/jml-logo.svg");
  if (bottomLogo) {
    ctx.drawImage(bottomLogo,935,FOOTER_Y+12,235,63);
  }

  $("visualSection").style.display="block";
}

$("load").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) return;

  $("load").disabled = true;
  $("status").textContent = "Récupération de l'annonce et des photos originales…";
  $("status").className = "status";
  $("result").style.display = "none";

  try {
    const response = await fetch("/api/scrape", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Impossible de récupérer l'annonce.");

    const p = data.listing;
    currentData = data;
    const rawTitle = p.title || "Annonce JML";
    const typeMatch = rawTitle.match(/^(Appartement|Maison|Pavillon|Terrain|Garage|Immeuble|Local commercial|Local|Studio|Duplex|Loft)/i);
    const propertyType = typeMatch ? typeMatch[1] : rawTitle.split(/\s+/)[0];
    $("title").textContent = propertyType;
    $("subtitle").textContent = [
      p.rooms ? `${p.rooms} pièces` : "",
      p.bedrooms ? `${p.bedrooms} chambres` : "",
      p.surface || ""
    ].filter(Boolean).join(" · ");
    $("location").textContent = p.location || "Localisation non détectée";
    $("price").textContent = p.price || "Prix non détecté";
    $("description").textContent = p.description || "Description non détectée";
    $("surface").textContent = p.surface || "—";
    $("terrain").textContent = p.terrain || "—";
    $("bedrooms").textContent = p.bedrooms ?? "—";
    $("rooms").textContent = p.rooms ?? "—";

    const photos = $("photos");
    photos.innerHTML = "";

    // Preload first, then insert only successfully loaded images.
    // This avoids empty grid cells while an image is still loading.
    let loadedCount = 0;
    let finishedCount = 0;
    const totalCount = p.images.length;

    const refreshPhotoStatus = () => {
      if (finishedCount < totalCount) {
        $("photoWarning").textContent = `⏳ Vérification des ${totalCount} photo(s) originales…`;
        return;
      }

      const extraction = p.photoExtraction || {};
      const expected = p.expectedPhotoCount;
      const complete = data.photoPolicy?.publishAllowedForPhotoTest === true;

      const photoState = p.photoStatus || (complete ? "complete" : "partial");
      const stateConfig = {
        complete: { label: "🟢 Galerie complète et vérifiée", className: "photo-complete" },
        partial: { label: "🟠 Galerie partiellement récupérée", className: "photo-partial" },
        unreliable: { label: "🔴 Galerie non fiable — publication interdite", className: "photo-blocked" }
      }[photoState] || { label: "🔴 Galerie non fiable — publication interdite", className: "photo-blocked" };

      $("photoStatus").className = "photo-status " + stateConfig.className;
      $("photoStatus").textContent = stateConfig.label;

      $("photoWarning").classList.toggle("photo-blocked", !complete);
      $("photoWarning").textContent = complete
        ? `${loadedCount} photo(s) originales détectées dans la galerie principale. Aucune photo IA ne sera utilisée.`
        : "⚠ Extraction photo non considérée comme complète : publication bloquée jusqu'à vérification.";

      const expectedText = expected != null ? ` • ${loadedCount}/${expected} attendue(s)` : "";
      const reasons = Array.isArray(extraction.reasons) && extraction.reasons.length
        ? `<br>Motif : ${extraction.reasons.join(" ") }`
        : "";

      $("photoMeta").innerHTML =
        `Source : ${extraction.source || "aucune"} • confiance : ${extraction.confidence || "faible"}${expectedText}` +
        reasons;
    };

    const loadOriginalPhoto = (src) => new Promise((resolve) => {
      const img = new Image();
      img.alt = "Photo originale de l'annonce JML";
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = "/api/image?url=" + encodeURIComponent(src);
    });

    p.images.forEach(async (src) => {
      const img = await loadOriginalPhoto(src);
      finishedCount++;

      if (img) {
        img.loading = "lazy";
        img.className = "verified-photo";
        img.dataset.photoPosition = String(loadedCount + 1);
        photos.appendChild(img);
        loadedCount++;
      }

      refreshPhotoStatus();
    });

    if (!totalCount) {
      $("photoWarning").textContent = "⚠ Aucune photo originale récupérée : la future publication devra rester bloquée.";
    }

    $("status").textContent = "Annonce récupérée.";
    $("status").className = "status success";
    $("result").style.display = "block";
  } catch (error) {
    $("status").textContent = error.message;
    $("status").className = "status error";
  } finally {
    $("load").disabled = false;
  }
});

$("generate").addEventListener("click", async () => {
  if (!currentData) return;
  if (currentData.photoPolicy?.publishAllowedForPhotoTest !== true) {
    alert("La galerie doit être complète et vérifiée avant de générer le visuel.");
    return;
  }
  await renderJmlTemplate();
  $("visualSection").scrollIntoView({ behavior: "smooth", block: "start" });
});


$("generateAI").addEventListener("click", async () => {
  if (!currentData) return;
  if (currentData.photoPolicy?.publishAllowedForPhotoTest !== true) {
    alert("La galerie doit être complète et vérifiée avant d'utiliser Gemini.");
    return;
  }

  const button = $("generateAI");
  const status = $("aiStatus");
  button.disabled = true;
  status.textContent = "✨ Gemini analyse l'annonce et les photos originales…";

  try {
    const response = await fetch("/api/ai-layout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ listing: currentData.listing })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Gemini n'est pas disponible.");

    currentData.listing.aiPlan = data.plan;
    status.textContent = "🟢 Gemini a préparé le contenu. Les photos restent 100 % originales.";
    await renderJmlTemplate();
    $("visualSection").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (error) {
    status.textContent = "🔴 " + error.message;
  } finally {
    button.disabled = false;
  }
});

$("download").addEventListener("click", () => {
  const ref = currentData?.listing?.reference || "annonce";
  const link = document.createElement("a");
  link.download = "JML-" + ref + ".png";
  link.href = $("visual").toDataURL("image/png");
  link.click();
});
</script>
</body>
</html>
